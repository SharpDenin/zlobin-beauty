services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  identity:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/identity/cmd/identity
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://identity:identity@postgres:5432/identity?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-in-production-32chars}
      MIGRATIONS_DIR: /migrations
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      LOG_LEVEL: info
    volumes:
      - ./backend/services/identity/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  organizations:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/organizations/cmd/organizations
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://organizations:organizations@postgres:5432/organizations?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-in-production-32chars}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      MIGRATIONS_DIR: /migrations
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
    volumes:
      - ./backend/services/organizations/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  marketplace:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/marketplace/cmd/marketplace
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-in-production-32chars}
      MIGRATIONS_DIR: /migrations
      ORGANIZATIONS_URL: http://organizations:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
    volumes:
      - ./backend/services/marketplace/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      organizations:
        condition: service_started

  booking:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/booking/cmd/booking
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://booking:booking@postgres:5432/booking?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-in-production-32chars}
      MIGRATIONS_DIR: /migrations
      MARKETPLACE_URL: http://marketplace:8080
      ORGANIZATIONS_URL: http://organizations:8080
      CLIENTS_URL: http://clients:8080
      COMMUNICATIONS_URL: http://communications:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
    volumes:
      - ./backend/services/booking/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      marketplace:
        condition: service_started
      clients:
        condition: service_started

  clients:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/clients/cmd/clients
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://clients:clients@postgres:5432/clients?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-in-production-32chars}
      MIGRATIONS_DIR: /migrations
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
    volumes:
      - ./backend/services/clients/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  communications:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/communications/cmd/communications
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://communications:communications@postgres:5432/communications?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-in-production-32chars}
      MIGRATIONS_DIR: /migrations
      BOOKING_URL: http://booking:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
    volumes:
      - ./backend/services/communications/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: gateway/cmd/gateway
    environment:
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-in-production-32chars}
      IDENTITY_URL: http://identity:8080
      ORGANIZATIONS_URL: http://organizations:8080
      MARKETPLACE_URL: http://marketplace:8080
      BOOKING_URL: http://booking:8080
      CLIENTS_URL: http://clients:8080
      COMMUNICATIONS_URL: http://communications:8080
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      - identity
      - organizations
      - marketplace
      - booking
      - clients
      - communications

  bootstrap-admin:
    profiles: ["bootstrap"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: services/identity/cmd/bootstrap-admin
    environment:
      DATABASE_URL: postgres://identity:identity@postgres:5432/identity?sslmode=disable
      MIGRATIONS_DIR: /migrations
      JWT_SECRET: ${JWT_SECRET:-dev-change-me-in-production-32chars}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Admin}
    volumes:
      - ./backend/services/identity/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
